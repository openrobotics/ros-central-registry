matrix:
  platform:
    - ubuntu2204
    - macos_arm64
  bazel:
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--features=system_include_paths"
      - "--@llvm//config:experimental_stub_libgcc_s=False"
    build_targets:
      - "@qtlanguageserver//..."
