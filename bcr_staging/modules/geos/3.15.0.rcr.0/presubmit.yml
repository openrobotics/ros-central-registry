matrix:
  platform:
    - ubuntu2404
    - macos_arm64
  bazel:
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    build_targets:
      - "@geos//:geos"
      - "@geos//:geos_c"
    test_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    test_targets:
      - "@geos//:test_geos_unit"
