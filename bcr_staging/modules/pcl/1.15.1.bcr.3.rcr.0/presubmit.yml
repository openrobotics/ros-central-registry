build_and_test_flags: &build_and_test_flags
  - --cxxopt=-std=c++17
  - --process_headers_in_dependencies
  - --@pcl//:pcl_silence_malloc_warning=True

matrix:
  platform:
    - ubuntu2204
  bazel:
    - 8.x

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags: *build_and_test_flags
    test_flags: *build_and_test_flags
    build_targets:
      - '@pcl//...'
