[project]
name = "lyrical"
version = "2026.06.08"
requires-python = ">=3.11,<3.15"
dependencies = [
    "argcomplete>=3.1.4",
    "bokeh>=3.4.0",
    "catkin-pkg>=1.0.0",
    "clang-tidy>=22.1.8",
    "clang-format>=22.1.8",
    "cryptography>=43.0.0",
    "deprecated>=1.2.14",
    "empy>=3.3.4",
    "fastapi>=0.79.0",
    # No cp314 wheels yet; the sdist needs a system GDAL, which we never use.
    # rmf_building_map_tools imports it lazily, only for GeoPackage export.
    # No Linux aarch64 wheels are published, and the sdist needs a system GDAL.
    "fiona>=1.10.1; python_version < '3.14' and (sys_platform != 'linux' or platform_machine != 'aarch64')",
    "filelock>=3.13.1",
    "flake8-blind-except>=0.2.1",
    "flake8-builtins>=2.1.0",
    "flake8-class-newline>=1.6.0",
    "flake8-comprehensions>=3.14.0",
    "flake8-deprecated>=2.2.1",
    "flake8-docstrings>=1.6.0",
    "flake8-import-order>=0.18.2",
    "flake8-quotes>=3.4.0",
    "flake8>=7.1.0",
    "GitPython>=3.1.45",
    "importlib-metadata>=4.12.0",
    "lark>=1.1.9",
    "lxml>=6.0.0",
    "matplotlib>=3.9.0",
    "mypy>=1.13.0",
    # numpy >=2.5 dropped cp311 wheels on PyPI, causing rules_python to fall
    # back to building from sdist on Python 3.11.
    "numpy>=2.1.0,<2.5",
    # >=4.10 is the first release built against numpy 2 (numpy>=2.1 above).
    "opencv-python>=4.10.0.84,<5",
    "osrf-pycommon>=2.0.2",
    "packaging>=24.2",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "psutil>=6.0.0",
    "pycodestyle>=2.11.1",
    "pydantic>=2.10.0",
    "pydot>=3.0.0",
    "PyQt-builder>=1.17.0",
    "PyQt6>=6.8.0",
    # pyproj >=3.8 dropped cp311 wheels on PyPI, causing rules_python to fall
    # back to building from sdist on Python 3.11.
    "pyproj>=3.6.0,<3.8",
    "pyqtgraph>=0.13.7",
    "PySide6>=6.8.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "pytest>=8.0.0",
    "python-socketio>=5.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "jinja2>=3.1.2",
    "rtree>=1.3.0",
    "typeguard>=4.0.0",
    "semver>=3.0.2",
    "setuptools>=70.0.0",
    "shapely>=2.0.0",
    "shiboken6-generator>=6.8.0",
    "shiboken6>=6.8.0",
    "sip>=6.8.0",
    "types-PyYAML>=6.0.12.20240917",
    "typing-extensions>=4.12.0",
    "urllib3>=2.2.0",
    "uvicorn>=0.18.2",
    "vcstool>=0.3.0"
]
