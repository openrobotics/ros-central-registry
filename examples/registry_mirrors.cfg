# Bazel downloader config (--downloader_config). Rewrites apply to every
# download, including registry files (MODULE.bazel, source.json, ...).
#
# We are seeing HTTP 429 (Too Many Requests) responses from bazel.ros.org,
# because GitHub Pages throttles it. Serve it from its GCS mirror instead.
#
# This is deliberately a single rule rather than "bazel.ros.org, then fall
# back to GCS": Bazel retries a 429 several times with backoff before trying
# the next URL, and every BCR-only module is looked up in bazel.ros.org first
# (it's the first --registry), so a fallback list makes resolution crawl
# whenever bazel.ros.org is throttling.
rewrite bazel.ros.org/(.*) storage.googleapis.com/intrinsic-opensource-buildcache/registry/$1
