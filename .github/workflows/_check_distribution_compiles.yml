# Reusable workflow: build the distribution for a given OS and bazel version.

name: _check_distribution_compiles

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch or ref to check out.'
        required: true
        type: string
      changed_packages:
        description: >
          Space-separated package names to additionally bazel build in
          full (e.g. "ouster_ros ouster_sensor_msgs"), on top of the
          --config=<variant> build below -- a package a PR adds/patches
          isn't necessarily part of any variant, so the variant build
          alone can silently never touch it. Bazel's --target_pattern_file
          (what --config=<variant> sets) can't be combined with explicit
          targets on the same invocation, so this runs as a second, separate
          bazel build. Empty/unset builds nothing extra.
        required: false
        type: string
        default: ""

env:
  ANDROID_HOME: ""

jobs:
  checkout-setup-build-test:
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    name: build_${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace
        shell: bash
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ github.event_name == 'pull_request' && fromJSON('["9.x"]') || fromJSON('["8.x", "9.x"]') }}
        ros:
        - lyrical.2026-06-08.rcr.2
        variant:
        - perception
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm"]') || fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26-intel", "macos-26"]') }}
    steps:

    # Pin Xcode explicitly on macOS runners.
    - name: Select Xcode
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: '26.3'

    # Setup bazel with controlled caching that is invariant to RMW implementation.
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        ref: ${{ inputs.branch }}

    # Setup auth to allow pushing to the remote cache. The WIF trust policy
    # only covers the upstream repo -- this (and --remote-cache-write below)
    # is skipped on forks, which fall back to the default config's
    # anonymous, read-only cache access rather than failing when a write
    # is attempted with no valid credentials.
    - name: Authenticate to Google Cloud
      if: (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
      uses: "google-github-actions/auth@v3"
      with:
        workload_identity_provider: projects/367706864683/locations/global/workloadIdentityPools/github-automation/providers/build-dev
        service_account: github-automation-bot@gha-openrobotics-rcr.iam.gserviceaccount.com
        create_credentials_file: true

    # Setup bazel to use a specific cache.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true

    # Prepare the bazel workspace
    - name: Prepare workspace
      id: prepare_workspace
      working-directory: .
      run: |
        bazel run //tools/ci:setup_workspace -- --release=${{ matrix.ros }} --tmpdir "$RUNNER_TEMP" \
            ${{ (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry' && '--remote-cache-write' || '' }}

    # Build whatever package(s) this PR actually touches, in case they
    # aren't part of the variant above -- see changed_packages' input docs.
    - name: Build changed packages
      id: build_changed_packages
      if: inputs.changed_packages != ''
      run: |
        TARGETS=""
        for pkg in ${{ inputs.changed_packages }}; do
          if bazel query "@${pkg}//..." >/dev/null 2>&1; then
            TARGETS="$TARGETS @${pkg}//..."
          else
            echo "Skipping @${pkg}//... (no targets found)"
          fi
        done
        if [ -n "$TARGETS" ]; then
          bazel build --config ci $TARGETS 2>&1 | tee build_changed_packages.log
        fi

    # Build the ros 2 distribution
    - name: Build
      id: build
      run: |
        bazel build --config ci --config=${{ matrix.variant }} 2>&1 | tee build.log
    - name: Update status badge (build)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_build.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.build.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.build.outcome == 'success' && 'green' || 'red' }}
      if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'

    - name: Compile logs
      uses: actions/upload-artifact@v7
      with:
        name: Compile logs ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
        path: |
          workspace/MODULE.bazel
          workspace/.bazelrc
          workspace/*.log
      if: always()
