# Triggered on any commit pushed to the main branch. It builds
# documentation, merges registry modules, and deploys the updated
# pages. 

name: commit

run-name: Build docs, merge modules, and deploy to github pages.

# Happens on any commit to the main branch.
on:
  push:
    branches:
      - main

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: true

# Prevents Android .bazelrc from affecting setup-bazel.
env:
  ANDROID_HOME: ""

# Permissions we need to deploy to github pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # Generate the pages.
  generate:
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Reset status badge
      if: (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: deployment.json
        label: deployment
        message: 'ⴵ'
        color: 'yellow'

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true

    - name: Regenerate docs
      run: bazel build //docs:html

    - name: Merge docs and modules
      run: |
        mkdir -p ./deploy/modules
        touch ./deploy/.nojekyll
        echo -e "{\n\t\"mirrors\": []\n}" > ./deploy/bazel_registry.json
        tar -xzvf bazel-bin/docs/html_docs.tar.gz -C ./deploy
        cp -R ./bcr_staging/modules/* deploy/modules
        cp -R ./modules/* deploy/modules

    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Upload site artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy

    - name: Notify the rcr-frontend to rebuild
      if: github.ref == 'refs/heads/main' && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.RCR_UI_PAT_TOKEN }}
        repository: openrobotics/rcr-frontend
        event-type: on-rcr-trigger

    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: deployment.json
        label: deployment
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
