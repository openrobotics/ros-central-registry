# This is the single staged pipeline for the repo, built out of the
# reusable workflows in this directory (the _check_*.yml files).

name: ci
run-name: Lint, test tooling, build and test the distribution, and deploy.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Filter paths
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          code:
            - 'bcr_staging/**'
            - 'examples/**'
            - 'modules/**'
            - 'tools/**'
            - 'bazel_registry.json'
            - '.bazelignore'

  lint:
    name: Lint source code
    uses: ./.github/workflows/_check_for_linting_errors.yml
    secrets: inherit

  tooling:
    name: Test tooling
    uses: ./.github/workflows/_check_tooling.yml
    secrets: inherit

  bazel_modules:
    name: Check modules
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # to post/update the module-diff PR comment.
    uses: ./.github/workflows/_check_bazel_modules.yml
    secrets: inherit

  changed-packages:
    name: Detect changed packages
    # A package this PR adds/patches isn't necessarily part of any of the
    # six fixed distribution variants (see AGENTS.md), so the variant build
    # below can silently never build or test it at all -- this finds every
    # package touched, so distribution_compiles/test_rmw_* can build/test
    # them directly too, on top of the variant. PR-only: on a push to main,
    # there's no meaningful base to diff against here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # must be zero for 'git diff' against the base to work.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true
    - name: Compute changed packages
      id: diff
      run: |
        git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- modules > /tmp/diff_status.txt
        PACKAGES=$(bazel run //tools/ci:changed_packages -- --diff-status /tmp/diff_status.txt --directory modules)
        echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  docs_build:
    name: Check documentation
    uses: ./.github/workflows/_check_docs_build.yml
    secrets: inherit

  distribution_compiles:
    name: Check distribution builds
    needs:
    - detect-changes
    - lint
    - tooling
    - bazel_modules
    - changed-packages
    - docs_build
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.tooling.result == 'success' &&
      needs.docs_build.result == 'success' &&
      (needs.bazel_modules.result == 'success' || needs.bazel_modules.result == 'skipped') &&
      (needs.changed-packages.result == 'success' || needs.changed-packages.result == 'skipped') &&
      needs.detect-changes.outputs.code == 'true'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_compiles.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      changed_packages: ${{ needs.changed-packages.outputs.packages }}
    secrets: inherit

  distribution_examples:
    name: Check examples build
    needs: [distribution_compiles]
    if: |
      !cancelled() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_examples.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
    secrets: inherit

  test_rmw_fastrtps_cpp:
    name: Test FastDDS
    needs: [distribution_compiles, changed-packages]
    if: |
      !cancelled() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_fastrtps_cpp
      changed_packages: ${{ needs.changed-packages.outputs.packages }}
    secrets: inherit

  test_rmw_fastrtps_dynamic_cpp:
    name: Test FastDDS (dynamic)
    needs: [distribution_compiles, changed-packages]
    if: |
      !cancelled() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_fastrtps_dynamic_cpp
      changed_packages: ${{ needs.changed-packages.outputs.packages }}
    secrets: inherit

  test_rmw_cyclonedds_cpp:
    name: Test CycloneDDS
    needs: [distribution_compiles, changed-packages]
    if: |
      !cancelled() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_cyclonedds_cpp
      changed_packages: ${{ needs.changed-packages.outputs.packages }}
    secrets: inherit

  test_rmw_zenoh_cpp:
    name: Test Zenoh
    needs: [distribution_compiles, changed-packages]
    if: |
      !cancelled() &&
      needs.distribution_compiles.result == 'success'
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_check_distribution_tests.yml
    with:
      branch: ${{ inputs.branch || github.ref }}
      rmw: rmw_zenoh_cpp
      changed_packages: ${{ needs.changed-packages.outputs.packages }}
    secrets: inherit
