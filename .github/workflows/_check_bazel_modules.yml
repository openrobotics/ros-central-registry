# Reusable workflow: checks that changes to Bazel modules abide by certain
# rules. Called (never triggered directly) from ci.yaml as part of the
# stage-1 fail-fast gate, and from weekly_rollup.yml to check the rollup's
# own diff against the same append-only guardrail enforced on human PRs.
# This diffs against a base ref (github.base_ref for pull_request events,
# or an explicit `base_ref` input for schedule/workflow_dispatch callers
# like weekly_rollup.yml that have no github.base_ref of their own).

name: _check_bazel_modules

on:
  workflow_call:
    inputs:
      base_ref:
        description: >
          Git ref to diff against. Defaults to github.base_ref, which is
          only set for pull_request events -- non-PR callers (e.g. a
          scheduled rollup diffing its branch against main) must pass this
          explicitly.
        required: false
        type: string
        default: ""

env:
  ANDROID_HOME: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  check_bazel_modules:
    name: Check ${{ matrix.directory }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        directory: ["modules", "bcr_staging/modules"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # must be zero for 'git diff' to work below.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true
    - name: Generate PR diff and old metadata files
      run: |
        BASE_REF="${{ inputs.base_ref || github.base_ref }}"

        # Generate the diff name-status file
        git diff --name-status "origin/$BASE_REF...HEAD" > /tmp/diff_status.txt

        # Extract the old versions of any modified metadata.json or MODULE.bazel files under the matrix directory
        mkdir -p /tmp/old_metadata
        git diff --name-only "origin/$BASE_REF...HEAD" | grep -E "^${{ matrix.directory }}/[^/]*/metadata.json$|^${{ matrix.directory }}/[^/]*/[^/]*/MODULE.bazel$" | while read -r file; do
            mkdir -p "/tmp/old_metadata/$(dirname "$file")"
            git show "origin/$BASE_REF:$file" > "/tmp/old_metadata/$file" || true
        done
    - name: Run PR modules check
      run: |
        bazel run //tools/ci:check_pr_modules -- \
            --diff-status /tmp/diff_status.txt \
            --old-metadata-dir /tmp/old_metadata \
            --directory "${{ matrix.directory }}"
    - name: Generate module diff
      # Always runs, even if the check above failed -- that's exactly when
      # seeing what a new module version actually changed is most useful.
      if: always()
      run: |
        bazel run //tools/ci:module_diff -- \
            --diff-status /tmp/diff_status.txt \
            --directory "${{ matrix.directory }}" \
            --output /tmp/module_diff.md
    - name: Write module diff to job summary
      # Always runs, including for fork PRs: unlike the PR comment below,
      # writing to GITHUB_STEP_SUMMARY needs no token permissions at all,
      # so this is the one place a fork PR's module diff is guaranteed to
      # be visible for review.
      if: always()
      run: |
        if [ -s /tmp/module_diff.md ]; then
          echo "### Module diff (${{ matrix.directory }})" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/module_diff.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Post or update module diff PR comment
      # Posts or updates the PR comment directly for non-fork PRs where
      # pull-requests: write is granted. On fork PRs (where GITHUB_TOKEN
      # is read-only), continue-on-error skips failure and lets the
      # workflow_run listener (post_module_diff_comment.yml) handle it.
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const diffPath = '/tmp/module_diff.md';
          if (!fs.existsSync(diffPath)) return;
          const diff = fs.readFileSync(diffPath, 'utf8').trim();
          if (!diff) return;

          const directory = '${{ matrix.directory }}';
          const marker = `<!-- module-diff: ${directory} -->`;
          const body = `${marker}\n${diff}`;

          const issueNumber = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;
          if (!issueNumber) return;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
          });

          const existing = comments.find((c) => c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
          }
    - name: Compute artifact name
      # Artifact names can't contain '/', so sanitize the matrix directory
      # (e.g. "bcr_staging/modules" -> "bcr_staging-modules"). The
      # post_module_diff_comment.yml workflow reverses this to recover the
      # original directory for the comment marker.
      if: always()
      id: artifact_name
      run: echo "name=$(echo '${{ matrix.directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
    - name: Upload module diff artifact
      # Uploading artifacts needs no special token permissions and works
      # the same on fork PRs, unlike posting a PR comment directly (see
      # the job summary step above). A separate, privileged workflow_run
      # listener (post_module_diff_comment.yml) downloads this artifact
      # from the base repo's context and posts/updates the PR comment.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: module-diff-${{ steps.artifact_name.outputs.name }}
        path: /tmp/module_diff.md
        if-no-files-found: ignore
        retention-days: 7
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: modules.json
        label: modules
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
