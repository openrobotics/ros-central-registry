# Reusable workflow: checks that the docs site builds. Called (never
# triggered directly) from ci.yaml as part of the stage-1 fail-fast gate --
# this is deliberately just the build check, not the actual publish (see
# commit.yaml for that), so a broken docs build is caught immediately
# rather than only after the multi-hour distribution/release stages finish.

name: _check_docs_build

on:
  workflow_call:

env:
  ANDROID_HOME: ""

jobs:
  check_docs_build:
    name: Check documentation builds
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true
    - name: Regenerate docs
      run: bazel build //docs:html
    - name: Update status badges
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: docs_build.json
        label: docs build
        message: ${{ job.status == 'success' && '✓' || 'x' }}
        color: ${{ job.status == 'success' && 'green' || 'red' }}
      if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
