# Reusable workflow: build the distribution with --dynamic_mode=off.
#
# Under --dynamic_mode=off every cc_binary/cc_test links its dependencies
# statically (collect_transitive_dynamic_deps yields an empty closure), while
# cc_shared_library targets keep their full dynamic closure. That exposes two
# classes of defect the regular (dynamic) build hides:
#
#   * a cc_shared_library that lists a `*transitive_dynamic_deps` aggregate in
#     dynamic_deps absorbs that closure statically and collides with siblings
#     ("Two shared libraries in dependencies link the same library
#     statically" / "linked statically ... but not exported");
#   * duplicate symbols that only ever coexisted in separate .so files (the
#     same source compiled into two libraries, non-inline definitions in
#     headers, two copies of a third-party library, a test with its own
#     main() plus gtest_main, ...).
#
# This is a build-only check: statically linked binaries cannot run most of
# the test suite, because plugin loading (pluginlib / class_loader / rosidl
# typesupport dispatch) relies on dlopen() resolving symbols against the host
# process. Linux x86_64 only -- the linking rules are platform-independent,
# and the dynamic build matrix already covers the other platforms.

name: _check_distribution_static

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch or ref to check out.'
        required: true
        type: string

env:
  ANDROID_HOME: ""

jobs:
  checkout-setup-build-static:
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    name: build_static_${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace
        shell: bash
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    strategy:
      fail-fast: false
      matrix:
        bazel:
        - 9.x
        ros:
        - lyrical.2026-10-05.rcr.0
        variant:
        - desktop_full
        os:
        - ubuntu-26.04
    steps:

    # The stock GitHub Actions Ubuntu image preinstalls ~30+ GB of toolchains
    # (.NET, Android, Haskell, CodeQL, etc.) that our hermetic Bazel build
    # never uses, leaving too little room for a full desktop_full build.
    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@v2.0.0

    # Like upstream libQt6Gui, QtGui links the glvnd dispatch libraries
    # (libGL, libGLX, libOpenGL, libEGL), so every Linux binary using it,
    # including host tools such as qsb, needs them at runtime.
    - name: Install GL runtime libraries (Linux)
      if: runner.os == 'Linux'
      # Runs before checkout, so the job's default working-directory
      # (workspace/) doesn't exist yet.
      working-directory: .
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglx0 libopengl0

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        ref: ${{ inputs.branch }}

    # Setup auth to allow pushing to the remote cache. The WIF trust policy
    # only covers the upstream repo -- this (and --remote-cache-write below)
    # is skipped on forks, which fall back to the default config's
    # anonymous, read-only cache access rather than failing when a write
    # is attempted with no valid credentials.
    - name: Authenticate to Google Cloud
      if: (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
      uses: "google-github-actions/auth@v3"
      with:
        workload_identity_provider: projects/367706864683/locations/global/workloadIdentityPools/github-automation/providers/build-dev
        service_account: github-automation-bot@gha-openrobotics-rcr.iam.gserviceaccount.com
        create_credentials_file: true

    # Setup bazel to use a specific cache. See _check_distribution_compiles
    # for why the server heap is pinned here.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true
        bazelrc: |
          common --repo_contents_cache=
          startup --host_jvm_args=-Xmx8g

    # Prepare the bazel workspace
    - name: Prepare workspace
      id: prepare_workspace
      working-directory: .
      run: |
        bazel run //tools/ci:setup_workspace -- --release=${{ matrix.ros }} --tmpdir "$RUNNER_TEMP" \
            ${{ (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry' && '--remote-cache-write' || '' }}

    # Analyze first (loading + analysis only, no actions executed): the
    # cc_shared_library link-once / export checks are analysis-time errors,
    # so they fail in their own step, separately from duplicate-symbol link
    # failures in the build step below.
    - name: Analyze (static)
      id: analyze
      run: |
        bazel build --nobuild --config ci --config=${{ matrix.variant }} --dynamic_mode=off 2>&1 | tee analyze_static.log

    # Build the ros 2 distribution with every binary linked statically.
    - name: Build (static)
      id: build
      run: |
        bazel build --config ci --config=${{ matrix.variant }} --dynamic_mode=off 2>&1 | tee build_static.log

    - name: Update status badge (static build)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}_build_static.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.build.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.build.outcome == 'success' && 'green' || 'red' }}
      if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'

    - name: Static compile logs
      uses: actions/upload-artifact@v7
      with:
        name: Static compile logs ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
        path: |
          workspace/MODULE.bazel
          workspace/.bazelrc
          workspace/*.log
      if: always()

