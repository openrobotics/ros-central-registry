# Reusable workflow: build the distribution for a given OS and bazel version.

name: _check_distribution_examples

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch or ref to check out.'
        required: true
        type: string

env:
  ANDROID_HOME: ""

jobs:
  checkout-setup-build-test:
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
    name: example_${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace
        shell: bash
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      # Only write to the shared remote cache from the upstream repo, never from forks.
      CACHE_WRITE_CONFIG: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry' && '--config=ci-cache-write' || '' }}
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ github.event_name == 'pull_request' && fromJSON('["9.x"]') || fromJSON('["9.x", "last_rc"]') }}
        ros:
        - lyrical.2026-10-05.rcr.0
        variant:
        - perception
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26"]') || fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26"]') }}
    steps:

    # Pin Xcode explicitly on macOS runners.
    - name: Select Xcode
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: '26.3'

    # The stock GitHub Actions Ubuntu image preinstalls ~30+ GB of toolchains
    # (.NET, Android, Haskell, CodeQL, etc.) that our hermetic Bazel build
    # never uses, leaving too little room for a full distribution build.
    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@v2.0.0

    # Like upstream libQt6Gui, QtGui links the glvnd dispatch libraries
    # (libGL, libGLX, libOpenGL, libEGL), so every Linux binary using it,
    # including host tools such as qsb, needs them at runtime. The x86_64
    # runner image ships them; the arm64 one does not.
    - name: Install GL runtime libraries (Linux)
      if: runner.os == 'Linux'
      # Runs before checkout, so the job's default working-directory
      # (workspace/) doesn't exist yet.
      working-directory: .
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglx0 libopengl0

    # Setup bazel with controlled caching that is invariant to RMW implementation.
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        ref: ${{ inputs.branch }}

    # Setup auth to allow pushing to the remote cache. The WIF trust policy
    # only covers the upstream repo -- this (and --config=ci-cache-write
    # below) is skipped on forks, which fall back to examples/.bazelrc's
    # default anonymous, read-only cache access rather than failing when a
    # write is attempted with no valid credentials.
    - name: Authenticate to Google Cloud
      if: (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'
      uses: "google-github-actions/auth@v3"
      with:
        workload_identity_provider: projects/367706864683/locations/global/workloadIdentityPools/github-automation/providers/build-dev
        service_account: github-automation-bot@gha-openrobotics-rcr.iam.gserviceaccount.com
        create_credentials_file: true

    # Setup bazel to use a specific cache.
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true
        # Pin the Bazel server heap to a fixed size for the free GitHub-hosted
        # runners: 16 GB on ubuntu-26.04 / ubuntu-26.04-arm, 7 GB on the
        # 3-core M1 macos-26 image. Half of RAM each way, leaving the rest
        # for the (--jobs=4) compiler/test processes. An explicit -Xmx wins
        # over the -XX:MaxRAMPercentage default in the workspace .bazelrc.
        bazelrc: |
          common --repo_contents_cache=
          startup --host_jvm_args=-Xmx${{ runner.os == 'macOS' && '3g' || '8g' }}

    # Checks examples
    - name: Analyze (examples)
      id: analyze
      working-directory: ./examples
      env:
        TMPDIR: ${{ runner.temp }}
      run: |
        bazel build --nobuild --config ci $CACHE_WRITE_CONFIG //... 2>&1 | tee examples_analyze.log

    - name: Build (examples)
      id: examples
      working-directory: ./examples
      env:
        TMPDIR: ${{ runner.temp }}
      run: |
        bazel build --config ci $CACHE_WRITE_CONFIG //... 2>&1 | tee examples_dynamic.log

    # Statically linked (--config portable) builds of one example, once per RMW.
    - name: Build (examples, portable)
      id: examples_portable
      working-directory: ./examples
      env:
        TMPDIR: ${{ runner.temp }}
      run: |
        for rmw in rmw_fastrtps_cpp rmw_fastrtps_dynamic_cpp rmw_cyclonedds_cpp rmw_zenoh_cpp; do
          bazel build --config ci $CACHE_WRITE_CONFIG --config portable --@rosdistro//:rmw=$rmw //:example_ros_publisher_cc 2>&1 | tee examples_static_$rmw.log
        done
    - name: Update status badge (examples)
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.STATUS_BADGE_SECRET }}
        gistID: f796805a77e0f05cc837b18e60142773
        filename: ${{ matrix.ros }}_${{ matrix.bazel }}_${{ matrix.os }}_examples.json
        label: ${{ matrix.bazel }}
        message: ${{ steps.examples.outcome == 'success' && steps.examples_portable.outcome == 'success' && '✓' || 'x' }}
        color: ${{ steps.examples.outcome == 'success' && steps.examples_portable.outcome == 'success' && 'green' || 'red' }}
      if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (github.event.pull_request.head.repo.full_name || github.repository) == 'openrobotics/ros-central-registry'

    - name: Example logs
      uses: actions/upload-artifact@v7
      with:
        name: Example logs ${{ matrix.ros }}_${{ matrix.variant }}_${{ matrix.bazel }}_${{ matrix.os }}
        path: |
          examples/MODULE.bazel
          examples/.bazelrc
          examples/*.log
      if: always()
