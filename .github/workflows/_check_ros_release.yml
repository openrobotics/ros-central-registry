# Reusable workflow: colcon build and test for coverage and performance
# against a given ROS distribution release. Called (never triggered
# directly) from ci.yaml as the stage after check_distribution succeeds.

name: _check_ros_release

on:
  workflow_call:
    inputs:
      distribution:
        description: 'Which distribution is the release for?'
        required: true
        type: string
      date:
        description: 'Release in YYYY-MM-DD.'
        required: true
        type: string

jobs:
  baseline-new-release:
    permissions:
      pull-requests: write
      contents: write
    name: ${{ matrix.variant }}_${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
        - desktop_full
        os:
        - ubuntu-26.04
        - ubuntu-26.04-arm
    steps:

    - name: Install ROS 2 build dependencies
      shell: bash
      run: |
        sudo apt install software-properties-common
        sudo add-apt-repository universe
        sudo apt update && sudo apt install curl -y
        export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F'"' '{print $4}')
        curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"
        sudo dpkg -i /tmp/ros2-apt-source.deb
        sudo apt-get update
        sudo apt-get install -y \
          python3-mypy \
          python3-pip \
          python3-pytest \
          python3-pytest-cov \
          python3-pytest-mock \
          python3-pytest-repeat \
          python3-pytest-rerunfailures \
          python3-pytest-runner \
          python3-pytest-timeout \
          python3-rosinstall-generator \
          ros-dev-tools
        sudo rosdep init
        rosdep update

    - name: Parse release and configure ROSDISTRO_INDEX_URL and ROS_DISTRO
      shell: bash
      run: |
        RELEASE_NAME="${{ inputs.distribution }}/${{ inputs.date }}"
        echo "ROS_DISTRO=${{ inputs.distribution }}" >> $GITHUB_ENV
        echo "ROSDISTRO_INDEX_URL=https://github.com/ros/rosdistro/releases/download/${RELEASE_NAME}/index-v4.yaml" >> $GITHUB_ENV

    - name: Generate repos file and import sources
      shell: bash
      run: |
        python3 -c "import sys; from rosinstall_generator.cli import main; sys.exit(main())" ${{ matrix.variant }} --rosdistro ${{ env.ROS_DISTRO }} --deps > ros2.repos
        mkdir -p src
        vcs import src < ros2.repos

    - name: Install system dependencies using rosdep
      shell: bash
      run: |
          rosdep install --from-paths src --ignore-src -y --skip-keys "fastcdr rti-connext-dds-7.7.0 urdfdom_headers" --rosdistro ${{ env.ROS_DISTRO }}

    # There is a bug in colcon where pytest returns a non-zero error code (5)
    # if a package contains no tests. This is not the behavior we want,
    # so we ignore the exit code of the test and test-result verbs.

    - name: Colcon Build
      shell: bash
      run: |
        start_time=$(date +%s)
        colcon build --merge-install --packages-up-to ${{ matrix.variant }} --cmake-args -DBUILD_TESTING=ON
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "### Build Duration: ${duration} seconds" >> $GITHUB_STEP_SUMMARY

    - name: Colcon Test
      shell: bash
      run: |
        start_time=$(date +%s)
        colcon test --merge-install --packages-up-to ${{ matrix.variant }} || true
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "### Test Duration: ${duration} seconds" >> $GITHUB_STEP_SUMMARY
        find -L build -name "*.xml" -print0 | tar -czf ${{ matrix.variant }}-${{ matrix.os }}.tar.gz --null -T -

    - name: Colcon Test Result
      shell: bash
      if: always()
      run: |
        start_time=$(date +%s)
        colcon test-result || true
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "### Test Result Duration: ${duration} seconds" >> $GITHUB_STEP_SUMMARY

    - name: Archive Test Results (JUnit XML)
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.variant }}-${{ matrix.os }}
        path: |
          ${{ matrix.variant }}-${{ matrix.os }}.tar.gz
