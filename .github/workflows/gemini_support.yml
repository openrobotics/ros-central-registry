# Interactive companion to gemini_implement_issue.yml. Mention "@gemini-bot" in an
# issue, a PR comment, or a PR review (including on PRs Gemini itself opened)
# and it responds or pushes follow-up commits addressing the feedback. Like
# the auto-implement workflow, the action only acts for users with write
# access to the repo, so only a maintainer's "@gemini-bot" mention triggers it —
# but the surrounding comment/issue thread is still untrusted content from
# whoever wrote it, so skim before relying on Gemini's response.

name: gemini-interactive

run-name: Respond to @gemini-bot mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: gemini-interactive-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read # lets Gemini read CI results on the PR it's responding in

jobs:
  gemini:
    name: Respond to @gemini-bot
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-bot') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@gemini-bot') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@gemini-bot') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@gemini-bot') || contains(github.event.issue.title, '@gemini-bot')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Checkout PR branch (if applicable)
      if: github.event.issue.pull_request || github.event.pull_request
      run: |
        gh pr checkout "${{ github.event.pull_request.number || github.event.issue.number }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: false
        repository-cache: true

    - name: Setup buildifier
      run: |
        curl -L https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64 -o buildifier
        chmod +x buildifier
        sudo mv buildifier /usr/local/bin/buildifier

    - name: Setup git identity
      run: |
        git config --global user.email "gemini-bot@users.noreply.github.com"
        git config --global user.name "gemini[bot]"

    - name: Run Gemini CLI
      id: gemini
      uses: google-github-actions/run-gemini-cli@v0
      with:
        gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        gemini_model: gemini-3.7-flash
        gemini_cli_version: latest
        prompt: |
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMMENT BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
          TARGET NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}

          You are running in an autonomous, non-interactive CI execution environment.
          You have only THIS SINGLE RUN to complete the entire task from start to finish.
          There are NO subsequent user turns or interactive follow-ups.

          CRITICAL EXECUTION RULES:
          - Never yield or stop to give conversational progress updates or announce your
            next steps (e.g. do NOT say "Let's do that now" or "My next step is...").
          - Execute all required steps yourself via tool calls continuously until the
            task is 100% complete (create workspace -> vendor modules -> edit -> build
            -> test -> lint -> create_patch -> git commit -> git push -> gh pr create).
          - Do not ask for user confirmation or wait for interactive input.
          - Output text ONLY at the very end as your final summary of work completed,
            AFTER all code changes, builds, tests, commits, and pushes are done.
          - Read AGENTS.md at the repo root in full — it's the mandatory
            guidance for coding agents in this repository, including the
            setup-workspace / vendor-module / create-patch skill pipeline in
            .agent/skills/ for patching packages under modules/, plus linting,
            licensing, and testing conventions. Follow it exactly, and use
            those skills rather than hand-editing anything under modules/ or
            hand-rolling `bazel run //tools/ci:...` invocations yourself.

          Then take any action required to address the comment/review feedback or discuss the issue:

          - If operating on an existing PR (IS_PR is true):
            - The PR branch is already checked out in this workspace.
            - Make the requested changes using the vendor-module / create-patch skills.
            - Run the relevant fast local checks (buildifier, ruff, and targeted tests — always via `bazel test ...`, never `pytest` on the host) on the vendored module before create_patch.
            - Clean up any `.rej`, `.orig`, or conflict files before calling create_patch.
            - After create_patch, verify module integrity with `bazel run //tools/ci:check_pr_modules`.
            - Sign off every commit (`git commit -s`) per CONTRIBUTING.md.
            - Push your commits directly to the PR branch (`git push`).
            - Do NOT run `gh pr create` since the PR already exists.
          - If answering a question or providing feedback without code changes:
            - Provide a thorough, accurate, and concise response in your final text output.
          - If implementing a new issue from scratch (IS_PR is false):
            - Create a new branch `gemini/issue-${{ github.event.issue.number }}` (`git checkout -b gemini/issue-${{ github.event.issue.number }}`).
            - Implement the changes, test and lint them, commit with sign-off (`git commit -s`), and push (`git push -u origin gemini/issue-${{ github.event.issue.number }}`).
            - Open a PR against main non-interactively using `gh pr create --title "<title>" --body "<body>"` (or `gh pr create --title "<title>" --body-file <file>`). Never run bare `gh pr create` without `--title` and `--body` flags because non-interactive environments do not have a TTY. Fill out .github/PULL_REQUEST_TEMPLATE.md cleanly.
          
          General guidelines:
          - Work efficiently: before writing any new Bazel content, find an
            existing, already-implemented package in modules/ with a similar
            shape and mirror its structure.
          - Interface completeness: When implementing interface packages, check
            all `.msg`, `.srv`, and `.action` files against the upstream source/tag
            and declare every single one in `deps` of `default_generators` or `core_generators`.
          - Upstream test parity: Port all non-integration unit tests defined
            upstream. Never hallucinate or invent new test files not present
            in upstream code. Do not hardcode `env = {"AMENT_PREFIX_PATH": ...}`
            in test targets. When writing discovery loops in tests, always spin
            the executor (`executor_->spin_some()`) for CycloneDDS compatibility.
            Ensure static singletons holding publishers are cleaned up before
            `rclcpp::shutdown()` for Zenoh compatibility.
          - Packaging conventions: Use `ament_index` (passed via `data = [":ament_index"]`)
            for data ingestion by targets in the package. Declare `ament_package`
            exactly once at the bottom of `BUILD.bazel` for downstream export. Internal
            targets must never depend on `:ament_package`.
          - Checkpoint progress via the create-patch skill as you go to avoid losing work.
          - Do not attempt a full distribution build; CI does that comprehensively.
          - After running create_patch do not edit any Bazel modules in ./modules or ./bcr_staging directly. Edit in the vendored folder and re-run create_patch.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GEMINI_CLI_TRUST_WORKSPACE: "true"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Post response to issue/PR
      if: steps.gemini.outputs.summary != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RESPONSE: ${{ steps.gemini.outputs.summary }}
        TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: |
        printf "%s\n" "$RESPONSE" > /tmp/response.md
        gh issue comment "$TARGET" --body-file /tmp/response.md
